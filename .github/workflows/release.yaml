name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/CPM
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build cmake

      - name: Configure
        run: |
          cmake -B build -G "Ninja Multi-Config" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCPM_SOURCE_CACHE=~/.cache/CPM

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist
          cp build/Release/metadata-cleaner dist/
          cp config/config.json dist/
          tar -czvf metadata-cleaner-linux-x64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: metadata-cleaner-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\CPM
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19.1"

      - name: Install Ninja
        run: choco install ninja

      - name: Configure
        run: |
          cmake -B build -G "Ninja Multi-Config" `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_C_COMPILER=clang-cl `
            "-DCPM_SOURCE_CACHE=$env:LOCALAPPDATA\CPM"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir dist
          copy build\Release\metadata-cleaner.exe dist\
          copy config\config.json dist\
          Compress-Archive -Path dist\* -DestinationPath metadata-cleaner-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: metadata-cleaner-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CPM
          key: ${{ runner.os }}-cpm-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cpm-

      - name: Install dependencies
        run: brew install ninja

      - name: Configure
        run: |
          cmake -B build -G "Ninja Multi-Config" \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCPM_SOURCE_CACHE=~/Library/Caches/CPM

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist
          cp build/Release/metadata-cleaner dist/
          cp config/config.json dist/
          tar -czvf metadata-cleaner-macos-x64.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: metadata-cleaner-macos-x64.tar.gz

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Prepare image name
        id: image
        run: echo "repository=${{ github.repository_owner }}/${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.image.outputs.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ steps.image.outputs.repository }}:latest

  release:
    needs: [build-linux, build-windows, build-macos, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            linux-build/metadata-cleaner-linux-x64.tar.gz
            windows-build/metadata-cleaner-windows-x64.zip
            macos-build/metadata-cleaner-macos-x64.tar.gz
          generate_release_notes: true
